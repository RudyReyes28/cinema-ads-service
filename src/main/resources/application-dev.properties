# DATA SOURCE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT
#jwt.secret=dev-secret-local-temporal-minimo-32-caracteres
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json

# Logging
logging.level.com.ads=DEBUG
logging.level.org.springframework.security=DEBUG

# Users Service
services.users.url=http://localhost:8082