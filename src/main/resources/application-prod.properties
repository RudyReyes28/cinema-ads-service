# ===============================
# = DATA SOURCE (PRODUCCION)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Apagamos los logs de SQL en producción para no saturar el servidor EC2
spring.jpa.show-sql=false

# ===============================
# = SECURITY / JWT (PRODUCCION)
# ===============================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI}

# ===============================
# = MICROSERVICIOS (PRODUCCION)
# ===============================
services.users.url=${USERS_SERVICE_URL}

# ===============================
# = KAFKA (PRODUCCION)
# ===============================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# ===============================
# = LOGGING (PRODUCCION)
# ===============================
# Cambiamos a INFO para mantener los logs limpios y ahorrar memoria
logging.level.com.ads=INFO
logging.level.org.springframework.security=INFO