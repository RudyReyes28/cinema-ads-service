# ===============================
# = SPRING CORE
# ===============================
spring.application.name=ads-service
spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]
server.port=8086

# ===============================
# = DATA SOURCE (DESARROLLO LOCAL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ads_service_db
spring.datasource.username=postgres
spring.datasource.password=1234

# ===============================
# = JPA / HIBERNATE / FLYWAY
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

# ===============================
# = SECURITY / JWT (DESARROLLO LOCAL)
# ===============================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json

# ===============================
# = MICROSERVICIOS (DESARROLLO LOCAL)
# ===============================
services.users.url=http://localhost:8082

# ===============================
# = KAFKA
# ===============================
spring.kafka.bootstrap-servers=18.188.55.33:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.consumer.group-id=ads-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# ===============================
# = AWS S3 (Se leen del .env siempre)
# ===============================
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# ===============================
# = CONFIGURACION ADICIONAL
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ===============================
# = LOGGING (DESARROLLO LOCAL)
# ===============================
logging.level.com.ads=DEBUG
logging.level.org.springframework.security=DEBUG