spring.application.name=ads-service
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=dev
# ===============================
# = DATA SOURCE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/ads_service_db
spring.datasource.username=postgres
spring.datasource.password=1234

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===============================
# = FLYWAY
# ===============================
spring.flyway.enabled=true


# Logging
logging.level.com.ads=DEBUG
logging.level.org.springframework.security=DEBUG

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
#app.openapi.dev-url=http://localhost:8080

# CORS Configuration
# Origenes permitidos
#app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4200

#app.frontend.url=http://localhost:5173

# JWT Configuration
#jwt.secret=dev-secret-local-temporal-minimo-32-caracteres
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json


# ===============================
# = AWS S3
# ===============================
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# ===============================
# = REST USERS SERVICE
# ===============================
services.users.url=http://localhost:8081/api/v1/users

# ===============================
# = MULTIPART
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# ===============================
# = KAFKA
# ===============================
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer
spring.kafka.consumer.group-id=ads-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# PORT
server.port=8086