spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.config.import=

# Variables del base que necesitan valor en tests
DB_URL=jdbc:h2:mem:testdb
DB_USERNAME=sa
DB_PASSWORD=

AWS_ACCESS_KEY=fake
AWS_SECRET_KEY=fake
AWS_REGION=us-east-1
AWS_S3_BUCKET_NAME=test-bucket

services.users.url=http://localhost:8081
#jwt.secret=dev-secret-local-temporal-minimo-32-caracteres
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service/.well-known/jwks.json
